services:
  backend:
    build: ./backend
    user: "1000:1000"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    command: bun run --watch src/main.ts

  video-server:
    build: ./backend
    user: "1000:1000"
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    command: bun run --watch src/videos/video-server.ts
